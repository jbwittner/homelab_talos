# homelab-talos/clusters/kalecgos/talconfig.yaml
# Requires talhelper >= v3.0.37 (multi-document strategic-merge patch support).
# Check: talhelper --version
clusterName: bleu-arcanogos
talosVersion: v1.13.5
kubernetesVersion: v1.36.2

endpoint: https://192.168.1.12:6443

# Désactiver le CNI par défaut (Flannel) + kube-proxy : Cilium prend le relais
cniConfig:
  name: none

nodes:
  - hostname: vert-itharius
    ipAddress: 192.168.1.12
    controlPlane: true
    installDiskSelector:
      serial: "P320HHBB250926006779"   # Patriot M.2 P320 128GB — OS uniquement
    # Patches spécifiques au nœud : layout disque + modules kernel LVM.
    # NB : strategic-merge uniquement (pas de RFC6902 sur configs multi-docs).
    patches:
      # 1) Modules device-mapper — patch du document v1alpha1 principal.
      #    dm_thin_pool = thin provisioning ; dm_snapshot = snapshots (optionnel).
      - |-
        machine:
          kernel:
            modules:
              - name: dm_mod
              - name: dm_thin_pool
              - name: dm_snapshot
      # 2) EPHEMERAL : occupe tout le disque système (128 Go dédié à l'OS).
      #    Plus de cap : il n'y a plus rien d'autre à loger dessus.
      - |-
        apiVersion: v1alpha1
        kind: VolumeConfig
        name: EPHEMERAL
        provisioning:
          diskSelector:
            match: system_disk
          grow: true
      # 3) Partition BRUTE pour le PV LVM — disque 512 Go dédié à la data.
      #    Sélection par serial : l'énumération nvmeXn1 n'est PAS stable.
      #    Partlabel résultant : r-lvmpv
      - |-
        apiVersion: v1alpha1
        kind: RawVolumeConfig
        name: lvmpv
        provisioning:
          diskSelector:
            match: disk.serial == "2102357DWVN0RA105082"
          minSize: 800GiB
          grow: true

# Patches cluster-wide
patches:
  - |-
    cluster:
      allowSchedulingOnControlPlanes: true
  - |-
    cluster:
      proxy:
        disabled: true