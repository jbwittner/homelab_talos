# homelab-talos/clusters/bleu-kalecgos/talconfig.yaml
# Requires talhelper >= v3.0.37 (multi-document strategic-merge patch support).
# Check: talhelper --version
#
# Cluster unique 3 control planes (allowSchedulingOnControlPlanes: true, pas de workers).
# VIP 192.168.1.14 — élu via etcd, ne PAS mettre en bail statique AdGuard.
clusterName: bleu-kalecgos
talosVersion: v1.13.5
kubernetesVersion: v1.36.2

# Endpoint = VIP, pas l'IP d'un nœud : kubeconfig/talosconfig survivent
# à la perte de n'importe quel control plane.
endpoint: https://192.168.1.14:6443

# CNI par défaut (Flannel) + kube-proxy désactivés : Cilium prend le relais.
cniConfig:
  name: none

# Le VIP doit figurer dans les SANs, sinon erreur TLS sur kubectl/talosctl.
additionalApiServerCertSans:
  - 192.168.1.14
additionalMachineCertSans:
  - 192.168.1.14

nodes:
  # ─────────────────────────────────────────────────────────────
  - hostname: vert-eranikus
    ipAddress: 192.168.1.11
    controlPlane: true
    installDiskSelector:
      serial: "P320HHBB250926006689"   # Patriot M.2 P320 128GB — OS uniquement
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: true                      # bail statique AdGuard sur la MAC
        vip:
          ip: 192.168.1.14
    patches:
      # Partition BRUTE pour le PV LVM — disque data dédié.
      # Sélection par serial : l'énumération nvmeXn1 n'est PAS stable.
      # Partlabel résultant : r-lvmpv
      - |-
        apiVersion: v1alpha1
        kind: RawVolumeConfig
        name: lvmpv
        provisioning:
          diskSelector:
            match: disk.serial == "25185002A2F3"   # CT1000P310SSD8 1 To — data
          minSize: 400GiB
          grow: true

  # ─────────────────────────────────────────────────────────────
  - hostname: vert-itharius
    ipAddress: 192.168.1.12
    controlPlane: true
    installDiskSelector:
      serial: "P320HHBB250926006779"   # Patriot M.2 P320 128GB — OS uniquement
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: true
        vip:
          ip: 192.168.1.14
    patches:
      - |-
        apiVersion: v1alpha1
        kind: RawVolumeConfig
        name: lvmpv
        provisioning:
          diskSelector:
            match: disk.serial == "2102357DWVN0RA105082"
          minSize: 400GiB
          grow: true

  # ─────────────────────────────────────────────────────────────
  - hostname: vert-ysondre
    ipAddress: 192.168.1.13
    controlPlane: true
    installDiskSelector:
      serial: "P320HHBB250926000686"
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: true
        vip:
          ip: 192.168.1.14
    patches:
      - |-
        apiVersion: v1alpha1
        kind: RawVolumeConfig
        name: lvmpv
        provisioning:
          diskSelector:
            match: disk.serial == "2102357DWVN0RA105625"
          minSize: 400GiB
          grow: true

# ═════════════════════════════════════════════════════════════
# Patches cluster-wide — identiques sur tous les nœuds.
# ═════════════════════════════════════════════════════════════
patches:
  # Pas de workers : les CP portent les workloads.
  - |-
    cluster:
      allowSchedulingOnControlPlanes: true

  # kube-proxy désactivé — remplacé par Cilium (kubeProxyReplacement).
  - |-
    cluster:
      proxy:
        disabled: true

  # Modules device-mapper pour OpenEBS LVM LocalPV.
  # dm_thin_pool = thin provisioning ; dm_snapshot = snapshots.
  - |-
    machine:
      kernel:
        modules:
          - name: dm_mod
          - name: dm_thin_pool
          - name: dm_snapshot

  # EPHEMERAL occupe tout le disque système (128 Go dédié à l'OS).
  - |-
    apiVersion: v1alpha1
    kind: VolumeConfig
    name: EPHEMERAL
    provisioning:
      diskSelector:
        match: system_disk
      grow: true